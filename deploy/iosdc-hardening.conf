# === iOS Development Centre — security hardening ===
# Included from the iosdc.geu.ac.in vhost. Affects exposure only, never content.

# 1. No directory listings anywhere in the docroot.
<Directory /var/www/iosdc>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# 2. Block version-control metadata (the whole .git tree was downloadable).
<DirectoryMatch "/\.(git|svn|hg)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.(git|gitignore|gitattributes|env|DS_Store)">
    Require all denied
</FilesMatch>

# 3. Block private keys, archives and editor/config files.
<FilesMatch "\.(pem|ppk|key|crt|p12|pfx|zip|tar|gz|bak|sql|log|sv)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.vscode">
    Require all denied
</DirectoryMatch>

# 4. Security response headers.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # Don't advertise the exact Apache build.
    Header unset X-Powered-By
</IfModule>
ServerTokens Prod
ServerSignature Off

# 5. Cache static assets (they are content-stable; HTML stays uncached).
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpeg              "access plus 1 year"
    ExpiresByType image/png               "access plus 1 year"
    ExpiresByType image/webp              "access plus 1 year"
    ExpiresByType image/svg+xml           "access plus 1 year"
    ExpiresByType text/css                "access plus 1 year"
    ExpiresByType application/javascript  "access plus 1 year"
    ExpiresByType font/woff               "access plus 1 year"
    ExpiresByType font/woff2              "access plus 1 year"
    ExpiresByType video/mp4               "access plus 1 year"
    ExpiresByType text/html               "access plus 0 seconds"
</IfModule>
